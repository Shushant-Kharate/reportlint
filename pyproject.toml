[project]
name = "reportlint-engine"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "pydantic>=2.9,<3", "lxml>=5.3,<7", "rapidfuzz>=3.10,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "python-docx>=1.1,<2", "pymupdf>=1.24,<2"]
pagination = ["pymupdf>=1.24,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "static*"]

[tool.setuptools.package-data]
static = ["*.html", "*.css", "*.js", "*.json", "*.png", "*.svg"]

[tool.pytest.ini_options]
pythonpath = ["."]
