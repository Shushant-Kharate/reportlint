[project]
name = "reportlint-engine"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1",
  "pydantic>=2.9,<3", "lxml>=5.3,<7", "rapidfuzz>=3.10,<4",
  "vercel-blob==0.5.0",
  "pymupdf>=1.24,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "python-docx>=1.1,<2", "pymupdf>=1.24,<2"]
pagination = ["pymupdf>=1.24,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["builtins/*.json", "builtins/*.docx"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.fastapi.static]
# The workspace middleware protects API data. Flutter assets are public and
# can be promoted to the CDN independently of that middleware.
cdn = true
